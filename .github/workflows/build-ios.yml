name: Build patched LANDrop iOS IPA (TrollStore)

# Run this workflow from a Git TAG. The decrypted input IPA is stored on that
# tag's draft GitHub Release as an asset; the build reads it from there.
# The workflow must first exist on the default branch so GitHub registers it;
# the version executed is the one contained in the selected tag.
on:
  workflow_dispatch:
    inputs:
      ipa_asset:
        description: Decrypted IPA asset name on the selected tag's draft Release
        required: false
        default: LANDrop_2.8.2.ipa
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: landrop-ios-${{ github.ref_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Require a tag ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "Run this workflow by selecting a TAG in 'Use workflow from'." >&2
            exit 1
          fi
          echo "Selected tag: $REF_NAME"

      - name: Checkout selected tag
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true

      # Cache only repeatable build inputs. The cached asset name is keyed by
      # tag so a different tag always uses its own decrypted IPA.
      - name: Cache build inputs
        uses: actions/cache@v4
        with:
          path: |
            .build-cache
            ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-landrop-ios-v4-${{ github.ref_name }}-${{ github.sha }}-${{ hashFiles('scripts/build_patched_ipa.sh', 'patches/ios/Share Extension/*', 'tools/*.py') }}
          restore-keys: |
            ${{ runner.os }}-landrop-ios-v4-${{ github.ref_name }}-

      - name: Static source checks
        run: python3 tools/check_patch_sources.py

      - name: Download decrypted IPA from selected tag's draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ inputs.ipa_asset }}
        run: |
          set -euo pipefail
          mkdir -p .build-cache
          # /releases/tags/$TAG only returns published releases. List releases
          # (drafts are visible with contents:write) and match the tag name.
          RELEASE_ID="$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq '[.[] | select(.tag_name == $t and .draft == true)] | sort_by(.created_at) | last | .id // empty' \
            --arg t "$TAG")"
          if [[ -z "$RELEASE_ID" ]]; then
            echo "No draft Release found for tag $TAG" >&2
            exit 1
          fi
          ASSET_JSON="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" \
            --jq '[.[] | select(.name == $n and (.name | endswith(".ipa")))] | last // empty' \
            --arg n "$ASSET")"
          if [[ -z "$ASSET_JSON" || "$ASSET_JSON" == "null" ]]; then
            echo "Asset $ASSET not found on draft Release for $TAG" >&2
            exit 1
          fi
          ASSET_ID="$(jq -r '.id' <<<"$ASSET_JSON")"
          DIGEST="$(jq -r '.digest // empty' <<<"$ASSET_JSON")"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GH_REPO/releases/assets/$ASSET_ID" > .build-cache/decrypted.ipa
          if [[ -n "$DIGEST" && "$DIGEST" == sha256:* ]]; then
            printf '%s  %s\n' "${DIGEST#sha256:}" .build-cache/decrypted.ipa | shasum -a 256 -c -
          fi
          unzip -t .build-cache/decrypted.ipa >/dev/null
          shasum -a 256 .build-cache/decrypted.ipa

      - name: Build ad-hoc signed TrollStore IPA
        env:
          INPUT_IPA: ${{ github.workspace }}/.build-cache/decrypted.ipa
          OUTPUT_IPA: ${{ github.workspace }}/LANDrop-2.8.2-fixed-trollstore.ipa
        run: |
          set -euo pipefail
          ORIGINAL_IPA=""
          export ORIGINAL_IPA
          bash -n scripts/build_patched_ipa.sh
          bash scripts/build_patched_ipa.sh

      - name: Validate output IPA
        run: |
          set -euo pipefail
          unzip -t LANDrop-2.8.2-fixed-trollstore.ipa >/dev/null
          python3 tools/verify_patched_ipa.py LANDrop-2.8.2-fixed-trollstore.ipa
          shasum -a 256 LANDrop-2.8.2-fixed-trollstore.ipa

      - name: Upload TrollStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: LANDrop-2.8.2-fixed-trollstore-${{ github.ref_name }}
          path: LANDrop-2.8.2-fixed-trollstore.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
